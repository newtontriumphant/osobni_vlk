<!DOCTYPE html>
<html>
    <head>
        <title>osobni vlk :3</title>
        <meta name="referrer" content="strict-origin-when-cross-origin">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <link rel="icon" href="https://png.pngtree.com/png-vector/20240317/ourmid/pngtree-silhouettes-of-a-wild-wolf-silhouettes-of-howling-wolves-wolf-muzzle-png-image_11993460.png">
    </head>
    <body>
        <div class="intro">
            <h1>osobni vlk!</h1>
            <img class="wolf" src="https://s3.animalia.bio/animals/photos/full/1x1/4UhsJ4Eaz02SzpkOwDkW.webp" alt="osobní vlk">
            <p>is it a wolf? a train? nope, its a map...</p>
        </div>

        <div class="login">
            <p>To recover your personal <s>wolves</s> trains, please log in with your username.</p>
            <p>If you don't have an account, enter a username to create one :)</p>
            <form id="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <button type="submit">Login</button>
            </form>

            <p id="login-status">Not logged in!</p>
        </div>

        <div id="route-search" hidden>
            <h2>find your train!</h2>

            <form id="route-form">
                <input type="text" id="start" placeholder="From" required>
                <input type="text" id="destination" placeholder="To" required>

                <input type="date" id="travel-date" required>
                <input type="time" id="travel-time" required>

                <select id="train-type">
                    <option value="all">All trains</option>
                    <option value="d-ticket">D-Ticket / Regionals</option>
                    <option value="long-distance">IC / ICE / RJ</option>
                    <option value="flix">FlixTrain</option>
                </select>

                <h3>Via (optional)</h3>
                <input type="text" id="via1" placeholder="Via 1">
                <input type="text" id="via2" placeholder="Via 2">
                <input type="text" id="via3" placeholder="Via 3">

                <button type="submit">Search connections</button>
            </form>

            <p id="user-status"></p>
            
            <button id="logout-button" type="button">Log Out</button>
        </div>

        <hr class="dotted">

        <div class="map">
            <div id="map"></div>
        </div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="script.js"></script>
    </body>
</html>
